openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Household expense ledger, categories, limits, and period totals.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        monthlyLimitAmount: { type: number, nullable: true, description: current monthly limit in the home currency }
        currentMonthUsage: { type: number, description: amount spent in this category this calendar month, home currency }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    CategoryLimitInput:
      type: object
      required: [monthlyLimitAmount]
      properties:
        monthlyLimitAmount: { type: number }
    Expense:
      type: object
      required: [id, categoryId, originalAmount, originalCurrency, homeAmount, homeCurrency, expenseDate]
      properties:
        id: { type: string }
        categoryId: { type: string }
        enteredByMemberId: { type: string }
        originalAmount: { type: number }
        originalCurrency: { type: string, description: ISO 4217 currency code as entered }
        homeAmount: { type: number, description: amount converted to the household home currency }
        homeCurrency: { type: string }
        expenseDate: { type: string, format: date }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [categoryId, amount, currency, expenseDate]
      properties:
        categoryId: { type: string }
        amount: { type: number }
        currency: { type: string, description: ISO 4217 currency code the expense was paid in }
        expenseDate: { type: string, format: date }
        note: { type: string, nullable: true }
    PeriodTotals:
      type: object
      required: [period, homeCurrency, total, byCategory]
      properties:
        period: { type: string, enum: [day, week, month] }
        homeCurrency: { type: string }
        total: { type: number }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, categoryName, amount]
            properties:
              categoryId: { type: string }
              categoryName: { type: string }
              amount: { type: number }
paths:
  /categories:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listCategories
      summary: List categories with current-month usage and limits
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: categories
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
    post:
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } }
      responses:
        '201':
          description: category created
          content:
            application/json: { schema: { $ref: '#/components/schemas/Category' } }
        '400':
          description: invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateCategory
      summary: Rename a category
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } }
      responses:
        '200':
          description: category updated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Category' } }
        '404':
          description: category not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
    delete:
      operationId: deleteCategory
      summary: Remove a category
      responses:
        '204':
          description: category deleted
        '404':
          description: category not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /categories/{categoryId}/limit:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setCategoryLimit
      summary: Set or update a category's monthly spending limit
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CategoryLimitInput' } }
      responses:
        '200':
          description: limit set
          content:
            application/json: { schema: { $ref: '#/components/schemas/Category' } }
        '404':
          description: category not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '400':
          description: invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /expenses:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listExpenses
      summary: List household expenses, optionally filtered by category or date range
      parameters:
        - name: categoryId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: expenses
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
    post:
      operationId: createExpense
      summary: Log a new expense, converting to the home currency if needed
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ExpenseInput' } }
      responses:
        '201':
          description: expense created
          content:
            application/json: { schema: { $ref: '#/components/schemas/Expense' } }
        '400':
          description: invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateExpense
      summary: Edit an existing expense
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ExpenseInput' } }
      responses:
        '200':
          description: expense updated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Expense' } }
        '404':
          description: expense not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '400':
          description: invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
    delete:
      operationId: deleteExpense
      summary: Delete an expense
      responses:
        '204':
          description: expense deleted
        '404':
          description: expense not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /totals:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getPeriodTotals
      summary: Get household spending totals and category breakdown for a period
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [day, week, month] }
        - name: date
          in: query
          description: any date within the period; defaults to today
          schema: { type: string, format: date }
      responses:
        '200':
          description: period totals
          content:
            application/json: { schema: { $ref: '#/components/schemas/PeriodTotals' } }
        '400':
          description: invalid period
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401':
          description: not authenticated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
